name: CI

on:
  pull_request:
    branches: [main, feat/init-project]

jobs:
  backend:
    name: Backend — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

  frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript + Vite build
        run: npm run build
        env:
          VITE_BACKEND_URL: "https://payment-agent.zeabur.app/"
          VITE_ALCHEMY_API_KEY: "ci-placeholder"
          VITE_WALLETCONNECT_PROJECT_ID: "ci-placeholder"
